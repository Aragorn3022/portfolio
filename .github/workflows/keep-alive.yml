name: Keep Render deployment alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live site
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://portfolio-lem8.onrender.com")
          echo "Response status: $status"
          if [ "$status" -ge 500 ]; then
            echo "Site returned a server error ($status)"
            exit 1
          fi
